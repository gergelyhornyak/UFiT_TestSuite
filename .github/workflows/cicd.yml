name: Run UFIT tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Build Docker image
        run: docker --debug build --progress=plain --pull=true -t test-suite-image .

      - name: Run tests
        run: docker --debug run --rm -v ${{ github.workspace }}/testInput:/ProjectDir/testInput -v ${{ github.workspace }}/testOutput:/ProjectDir/testOutput -v ${{ github.workspace }}/docker:/ProjectDir/scripts --name test-suite-container test-suite-image
      
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: /ProjectDir/testOutput/htmlReport/gtest_report.html  # Path inside the runner
      
